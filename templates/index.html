<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Resume Coach</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">
        <h1>AI Resume Coach</h1>
        <p class="subtitle">
            Compare your resume with a job description and receive
            personalized feedback.
        </p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('analyze') }}" method="POST" enctype="multipart/form-data"
              data-loading-text="Analyzing with AI…">
            <div class="form-group">
                <label for="resume_file">Upload Resume PDF</label>
                <input
                    id="resume_file"
                    name="resume_file"
                    type="file"
                    accept=".pdf,application/pdf"
                >
                <div class="file-preview" id="file-preview" hidden>
                    <div><strong data-file-name></strong><span data-file-size></span></div>
                    <button type="button" class="file-remove" data-clear-file>Remove</button>
                </div>
                <p class="field-help">
                    PDF only, up to 5 MB and 5 pages. Scanned PDFs need OCR first.
                </p>

                <div class="divider"><span>or paste text</span></div>

                <label for="resume">Resume Text</label>
                <textarea
                    id="resume"
                    name="resume"
                    rows="12"
                    maxlength="30000"
                    placeholder="Paste your resume here..."
                >{{ resume|default('', true) }}</textarea>
            </div>

            <div class="form-group">
                <label for="job_description">
                    Job Description
                </label>

                <textarea
                    id="job_description"
                    name="job_description"
                    rows="12"
                    maxlength="30000"
                    placeholder="Paste the job description here..."
                    required
                >{{ job_description|default('', true) }}</textarea>
            </div>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

        <a class="history-button" href="{{ url_for('history') }}">View My History</a>

    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
