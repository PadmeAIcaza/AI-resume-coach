<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Resume Coach</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}" aria-label="PurrspectiveAI home">
            <img src="{{ url_for('static', filename='purrspective.png') }}" alt="PurrspectiveAI">
        </a>
        <nav aria-label="Main navigation">
            <a class="active" href="{{ url_for('home') }}">Resume Coach</a>
            <a href="{{ url_for('history') }}">My History</a>
        </nav>
    </header>
    <main class="container home-page">
        <h1>AI Resume Coach</h1>
        <p class="subtitle">
            Compare your resume with a job description and receive
            personalized feedback.
        </p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('analyze') }}" method="POST" enctype="multipart/form-data"
              data-loading-text="Analyzing with AI…">
            <div class="resume-source-grid">
                <div class="form-group upload-panel">
                    <label for="resume_file">Upload Resume PDF</label>
                    <div class="file-drop">
                        <span class="upload-icon">⇧</span>
                        <strong>Drag &amp; drop your PDF here</strong>
                        <span>PDF only • Up to 5 MB • 5 pages max</span>
                        <input
                            id="resume_file"
                            name="resume_file"
                            type="file"
                            accept=".pdf,application/pdf"
                        >
                    </div>
                    <div class="file-preview" id="file-preview" hidden>
                        <div><strong data-file-name></strong><span data-file-size></span></div>
                        <button type="button" class="file-remove" data-clear-file>Remove</button>
                    </div>
                    <p class="field-help">Scanned PDFs need OCR first.</p>
                </div>
                <div class="source-or" aria-hidden="true">OR</div>
                <div class="form-group">
                    <label for="resume">Paste Resume Text</label>
                    <textarea
                        id="resume"
                        name="resume"
                        rows="9"
                        maxlength="30000"
                        placeholder="Paste your resume here..."
                    >{{ resume|default('', true) }}</textarea>
                </div>
            </div>

            <div class="form-group job-panel">
                <label for="job_description">
                    Job Description
                </label>

                <textarea
                    id="job_description"
                    name="job_description"
                    rows="9"
                    maxlength="30000"
                    placeholder="Paste the job description here..."
                    required
                >{{ job_description|default('', true) }}</textarea>
            </div>

            <button type="submit">
                ✨&nbsp; Analyze Resume
            </button>

        </form>



    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
